name: build-xingchen-apk

# 在 GitHub 的 x86_64 runner 上出 arm64 APK。不需要 qemu、不需要 arm64 宿主。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'xingchen/**'
      - '.github/workflows/build-xingchen-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android build env (JDK 21 + Python 3.10 + SDK 37)
        uses: ./.github/actions/setup-android-env
          sdkmanager --list_installed | sed -n '1,20p'

      - name: Build APK
        run: bash xingchen/scripts/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xingchen-apk
          path: |
            xingchen-src/app/build/outputs/apk/**/*.apk
            xingchen-src/app/build/outputs/apk/**/*.json
          if-no-files-found: error
