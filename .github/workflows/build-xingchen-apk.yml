name: build-xingchen-apk

# 在 GitHub 的 x86_64 runner 上出 arm64 APK。不需要 qemu、不需要 arm64 宿主。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'xingchen/**'
      - '.github/workflows/build-xingchen-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '21.0.3'

      - name: Setup Python 3.10 (Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK packages (use preinstalled cmdline-tools)
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          for p in "platforms;android-37.0" "platforms;android-37.1" "platforms;android-37.2" \
                   "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"; do
            echo "--- $p"
            "$SDKMANAGER" "$p" >/dev/null 2>&1 || echo "[warn] $p 装不上，交给 AGP 自动下载"
          done
          sdkmanager --list_installed | sed -n '1,20p'

      - name: Build APK
        run: bash xingchen/scripts/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xingchen-apk
          path: |
            xingchen-src/app/build/outputs/apk/**/*.apk
            xingchen-src/app/build/outputs/apk/**/*.json
          if-no-files-found: error
