name: build-xingchen-apk

# 在 GitHub 的 x86_64 runner 上出 arm64 APK。不需要 qemu、不需要 arm64 宿主。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'xingchen/**'
      - '.github/workflows/build-xingchen-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android build env (JDK 21 + Python 3.10 + SDK 37)
        uses: ./.github/actions/setup-android-env
          sdkmanager --list_installed | sed -n '1,20p'

      - name: Build APK
        run: bash xingchen/scripts/build.sh

      - name: Upload APK artifact (best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xingchen-apk
          path: xingchen-src/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish APK as release asset (artifact quota may be full)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="$(ls -1 xingchen-src/app/build/outputs/apk/*/*/*.apk 2>/dev/null | head -1)"
          if [ -z "$APK" ]; then echo "没找到 APK"; exit 1; fi
          ls -lh "$APK"; sha256sum "$APK"
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" "$APK" \
            --title "$TAG XingChen" \
            --notes "自动构建 ${{ github.sha }} / run ${{ github.run_number }}" \
            || gh release upload "$TAG" "$APK" --clobber
          gh release view "$TAG" --json url -q .url
