name: build-webhtv-apk

# 出「已吸收上游 fish2018/webhtv 修复」的 WebHTV APK。
# 基线是 fork Silent1566/webhtv（1776 个提交的功能主线），再叠加 3 个上游修复。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'webhtv/**'
      - '.github/workflows/build-webhtv-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android build env (JDK 21 + Python 3.10 + SDK 37)
        uses: ./.github/actions/setup-android-env

      - name: Build absorbed APK
        run: bash webhtv/scripts/build-apk.sh "$RUNNER_TEMP/webhtv-fork"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-absorbed-apk
          path: ${{ runner.temp }}/webhtv-fork/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
