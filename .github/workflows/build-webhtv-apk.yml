name: build-webhtv-apk

# 出「已吸收上游 fish2018/webhtv 修复」的 WebHTV APK。
# 基线是 fork Silent1566/webhtv（1776 个提交的功能主线），再叠加 3 个上游修复。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'webhtv/**'
      - '.github/workflows/build-webhtv-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android build env (JDK 21 + Python 3.10 + SDK 37)
        uses: ./.github/actions/setup-android-env

      - name: Build absorbed APK
        run: bash webhtv/scripts/build-apk.sh "$RUNNER_TEMP/webhtv-fork"

      - name: Upload APK artifact (best-effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-absorbed-apk
          path: ${{ runner.temp }}/webhtv-fork/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish APK as release asset (artifact quota may be full)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="$(ls -1 "$RUNNER_TEMP"/webhtv-fork/app/build/outputs/apk/*/*/*.apk 2>/dev/null | head -1)"
          if [ -z "$APK" ]; then echo "没找到 APK"; exit 1; fi
          ls -lh "$APK"; sha256sum "$APK"
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" "$APK" \
            --title "$TAG WebHTV" \
            --notes "自动构建 ${{ github.sha }} / run ${{ github.run_number }}" \
            || gh release upload "$TAG" "$APK" --clobber
          gh release view "$TAG" --json url -q .url
