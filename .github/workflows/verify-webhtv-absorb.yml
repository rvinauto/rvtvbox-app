name: verify-webhtv-absorb

# 校验「上游 fish2018/webhtv 的修复移植到 fork Silent1566/webhtv」能否编译通过。
# 只编译 Java（两个 ABI）+ 跑 native 校验脚本，不出整包，几分钟内跑完。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'webhtv/**'
      - '.github/workflows/verify-webhtv-absorb.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android build env (JDK 21 + Python 3.10 + SDK 37)
        uses: ./.github/actions/setup-android-env

      - name: Apply upstream fixes + compile both ABIs
        run: bash webhtv/scripts/apply.sh "$RUNNER_TEMP/webhtv-fork"

      - name: Show merged diff
        if: always()
        run: |
          cd "$RUNNER_TEMP/webhtv-fork" 2>/dev/null || exit 0
          git log --oneline -3
          git show --stat --oneline HEAD | tail -20
