name: verify-webhtv-absorb

# 校验「上游 fish2018/webhtv 的修复移植到 fork Silent1566/webhtv」能否编译通过。
# 只编译 Java（两个 ABI）+ 跑 native 校验脚本，不出整包，几分钟内跑完。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'webhtv/**'
      - '.github/workflows/verify-webhtv-absorb.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '21.0.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 37 / build-tools 37 / NDK 29 / CMake 3.22.1
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          for p in "platforms;android-37.0" "platforms;android-37.1" "platforms;android-37.2" \
                   "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"; do
            echo "--- $p"
            sdkmanager "$p" >/dev/null 2>&1 || echo "[warn] $p 装不上，交给 AGP 自动下载"
          done

      - name: Apply upstream fixes + compile both ABIs
        run: bash webhtv/scripts/apply.sh "$RUNNER_TEMP/webhtv-fork"

      - name: Show merged diff
        if: always()
        run: |
          cd "$RUNNER_TEMP/webhtv-fork" 2>/dev/null || exit 0
          git log --oneline -3
          git show --stat --oneline HEAD | tail -20
